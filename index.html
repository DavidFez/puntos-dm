<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#020617">
    <title>Puntos ❤️</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">

    <header class="p-5 text-center border-b border-slate-800 bg-slate-900/50 backdrop-blur-md">
        <h1 class="text-xl font-bold bg-gradient-to-r from-pink-500 to-violet-500 bg-clip-text text-transparent">
            Puntos de Mayerli y David
        </h1>
        <p class="text-xs text-slate-400 mt-1">
            Fecha límite: <span id="meta-fecha" class="text-slate-500 font-mono">--</span>
        </p>
    </header>

    <main class="max-w-md mx-auto p-4 pb-28">

        <!-- ============ VISTA: DUELO ============ -->
        <section id="vista-duelo" data-vista class="space-y-6">

            <div class="text-center h-6 flex items-center justify-center">
                <span id="mensaje-motivador" class="text-xs font-medium text-violet-400 italic transition-all duration-500"></span>
            </div>
            <p id="sr-marcador" class="sr-only" aria-live="polite"></p>

            <div class="grid grid-cols-1 gap-4">
                <div class="relative overflow-hidden bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-2xl">
                    <div class="flex justify-between items-center mb-3">
                        <div class="flex items-center gap-3">
                            <img id="foto-m" src="may.jpeg" alt="Mayerli" width="60" height="60" loading="lazy" class="avatar-frame border-2 border-pink-500 shadow-lg">
                            <span class="text-lg font-medium text-pink-300">Mayerli</span>
                        </div>
                        <span id="puntos-m" class="text-4xl font-black tabular-nums">--</span>
                    </div>
                    <div class="w-full bg-slate-800 h-3 rounded-full overflow-hidden">
                        <div id="barra-m" class="bg-pink-500 h-full transition-all duration-700" style="width: 0%"></div>
                    </div>
                    <span id="flote-m" class="num-flote text-pink-400"></span>
                </div>

                <div class="relative overflow-hidden bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-2xl">
                    <div class="flex justify-between items-center mb-3">
                        <div class="flex items-center gap-3">
                            <img id="foto-d" src="dav.jpeg" alt="David" width="60" height="60" loading="lazy" class="avatar-frame border-2 border-blue-500 shadow-lg">
                            <span class="text-lg font-medium text-blue-300">David</span>
                        </div>
                        <span id="puntos-d" class="text-4xl font-black tabular-nums">--</span>
                    </div>
                    <div class="w-full bg-slate-800 h-3 rounded-full overflow-hidden">
                        <div id="barra-d" class="bg-blue-500 h-full transition-all duration-700" style="width: 0%"></div>
                    </div>
                    <span id="flote-d" class="num-flote text-blue-400"></span>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <button type="button" id="btn-fecha"
                    class="text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 py-2.5 rounded-xl transition-colors">📅 Fecha límite</button>
                <button type="button" id="btn-reiniciar"
                    class="text-xs font-semibold bg-slate-800 hover:bg-red-600 text-slate-200 py-2.5 rounded-xl transition-colors">🔄 Reiniciar ronda</button>
            </div>

            <div id="banner" hidden class="text-center text-sm font-medium rounded-xl px-4 py-3"></div>

            <fieldset id="form-registro" class="bg-slate-900 border border-slate-700 rounded-3xl p-6">
                <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-4 text-center">Registrar puntos</h2>
                <div class="space-y-4">
                    <select id="input-usuario" class="w-full bg-slate-800 border-none rounded-xl p-3 focus:ring-2 focus:ring-violet-500 outline-none text-white appearance-none">
                        <option value="" selected disabled hidden>Seleccionar nombre</option>
                        <option value="puntos_m">Para Mayerli</option>
                        <option value="puntos_d">Para David</option>
                    </select>

                    <div class="flex flex-row gap-2 w-full">
                        <input id="input-puntos" type="number" inputmode="numeric" min="1" placeholder="Pts"
                            class="w-[70px] bg-slate-800 border-none rounded-xl p-3 text-center outline-none focus:ring-2 focus:ring-violet-500 text-white box-border shrink-0">

                        <input id="input-motivo" type="text" maxlength="200" placeholder="¿Por qué?"
                            class="flex-1 bg-slate-800 border-none rounded-xl p-3 outline-none focus:ring-2 focus:ring-violet-500 text-white box-border min-w-0">
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <button type="button" onclick="enviarAccion('quitar')" aria-label="Descontar puntos"
                            class="bg-red-500/20 hover:bg-red-500 text-red-400 hover:text-white font-bold py-3 rounded-xl transition-all border border-red-500/50">Descontar (−)</button>
                        <button type="button" onclick="enviarAccion('añadir')" aria-label="Sumar puntos"
                            class="bg-emerald-500/20 hover:bg-emerald-500 text-emerald-400 hover:text-white font-bold py-3 rounded-xl transition-all border border-emerald-500/50">Sumar (+)</button>
                    </div>
                </div>
            </fieldset>

            <section class="bg-slate-900 border border-slate-800 rounded-3xl p-5">
                <h2 id="recompensas-titulo" class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-3">Recompensas</h2>
                <div id="recompensas-lista" class="flex flex-col gap-2 mb-3"></div>
                <fieldset id="recompensas-form" class="flex gap-2">
                    <input id="recompensa-input" type="text" maxlength="120" placeholder="Nueva recompensa"
                        class="flex-1 bg-slate-800 border-none rounded-xl p-2.5 text-sm outline-none focus:ring-2 focus:ring-violet-500 text-white min-w-0">
                    <button type="button" id="btn-recompensa"
                        class="bg-violet-600 hover:bg-violet-500 text-white text-sm font-semibold px-4 rounded-xl transition-colors shrink-0">Agregar</button>
                </fieldset>
            </section>
        </section>

        <!-- ============ VISTA: HISTORIAL ============ -->
        <section id="vista-historial" data-vista hidden class="space-y-4">
            <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider px-2">Historial de puntos</h2>
            <div id="historial-lista" class="flex flex-col gap-3">
                <div class="skeleton h-16 rounded-2xl"></div>
                <div class="skeleton h-16 rounded-2xl"></div>
                <div class="skeleton h-16 rounded-2xl"></div>
            </div>
            <button type="button" id="btn-mas" hidden
                class="mt-1 w-full text-xs text-violet-400 hover:text-violet-300 py-2 transition-colors">Cargar más</button>
        </section>

        <!-- ============ VISTA: MENSAJES ============ -->
        <section id="vista-mensajes" data-vista hidden class="space-y-4">
            <div class="px-2">
                <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider">Mensajes del día</h2>
                <p class="text-[11px] text-slate-500">Se borran solos después de 24 h.</p>
            </div>
            <div id="mensajes-lista" class="flex flex-col gap-2"></div>
            <div class="flex gap-2 sticky bottom-24 bg-slate-950/80 backdrop-blur py-2 rounded-2xl">
                <input id="mensaje-input" type="text" maxlength="200" placeholder="Escribe algo bonito…"
                    class="flex-1 bg-slate-800 border-none rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-violet-500 text-white min-w-0">
                <button type="button" id="btn-mensaje"
                    class="bg-violet-600 hover:bg-violet-500 text-white text-sm font-semibold px-4 rounded-xl transition-colors shrink-0">Enviar</button>
            </div>
        </section>
    </main>

    <!-- Burbuja flotante de mensaje nuevo -->
    <div id="burbuja" hidden></div>

    <!-- Barra de pestañas -->
    <nav id="tabbar" class="fixed bottom-0 inset-x-0 z-40 bg-slate-900/95 backdrop-blur border-t border-slate-800 flex">
        <button type="button" data-tab="duelo" aria-label="Duelo"
            class="tab flex-1 flex flex-col items-center gap-0.5 py-2.5 text-slate-500">
            <span class="text-xl leading-none">🏆</span>
            <span class="text-[10px] font-medium">Duelo</span>
        </button>
        <button type="button" data-tab="historial" aria-label="Historial"
            class="tab flex-1 flex flex-col items-center gap-0.5 py-2.5 text-slate-500">
            <span class="text-xl leading-none">📜</span>
            <span class="text-[10px] font-medium">Historial</span>
        </button>
        <button type="button" data-tab="mensajes" aria-label="Mensajes"
            class="tab relative flex-1 flex flex-col items-center gap-0.5 py-2.5 text-slate-500">
            <span class="text-xl leading-none">💬</span>
            <span class="text-[10px] font-medium">Mensajes</span>
            <span id="badge-mensajes" hidden
                class="absolute top-1 left-1/2 ml-2 min-w-[1rem] h-4 px-1 rounded-full bg-pink-500 text-white text-[10px] font-bold flex items-center justify-center">0</span>
        </button>
    </nav>

    <script type="module" src="app.js"></script>
</body>
</html>
